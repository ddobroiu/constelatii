# Postgres ruleaza deja pe server, in containerul "postgres-db" partajat cu
# celelalte proiecte (baza de date dedicata "constelatii" a fost creata acolo,
# vezi DATABASE_URL din .env). Acest compose porneste doar aplicatia Next.js.
services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        # Fixed on purpose: compose would otherwise interpolate a dev value
        # (localhost) from .env into the production bundle.
        NEXT_PUBLIC_APP_URL: https://constelatii.com
    restart: unless-stopped
    ports:
      - "3006:3000"
    env_file:
      - .env
